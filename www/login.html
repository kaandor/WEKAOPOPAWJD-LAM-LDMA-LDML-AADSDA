<!doctype html>
<html lang="en">
  <head> ... </head>
  <body>
    <div class="auth-shell">
      <div id="loginCard" class="auth-card">
        <div class="auth-top" style="justify-content: center;">
          <div class="brand" style="text-align: center;">
            <!-- Logo Klyx -->
          </div>
        </div>

        <div class="auth-title" style="text-align: center;">
          <h1>Entrar</h1>
          <p>Use seu GitHub para continuar.</p>
        </div>

        <div class="auth-actions" style="margin-top: 20px;">
          <button type="button" class="btn btn-github" id="githubLoginBtn">
            <!-- Ícone GitHub -->
            Entrar com GitHub
          </button>
        </div>

        <div id="error" class="error hidden"></div>
        <div id="connectionStatusDot" style="display:none;"></div>
      </div>
    </div>

    <script type="module">
      import { api } from "./js/api.js?v=20260204-fix3";
      import { redirectIfAuthed, applyTheme } from "./js/auth.js?v=20260204-fix3";
      import { handleLoginSuccess } from "./js/ui.js?v=20260204-fix3";

      // limpar sessão se ?logout
      if (new URLSearchParams(window.location.search).has('logout')) {
        localStorage.removeItem('klyx.session');
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      redirectIfAuthed();
      applyTheme();

      const githubBtn = document.getElementById('githubLoginBtn');
      if (githubBtn) {
        githubBtn.addEventListener('click', async () => {
          const originalText = githubBtn.innerHTML;
          githubBtn.innerHTML = 'Conectando...';
          githubBtn.disabled = true;

          const res = await api.auth.loginWithGithub();

          if (res && !res.ok) {
            const error = document.getElementById("error");
            error.textContent = res.data.error;
            error.classList.remove("hidden");
            githubBtn.innerHTML = originalText;
            githubBtn.disabled = false;
          }
        });
      }

      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');

      if (code && state) {
        if (githubBtn) {
          githubBtn.innerHTML = 'Autenticando...';
          githubBtn.disabled = true;
        }

        api.auth.handleGithubCallback(code, state)
          .then(res => {
            if (!res.ok) {
              const error = document.getElementById("error");
              error.textContent = res.data.error || 'Falha na autenticação com GitHub.';
              error.classList.remove("hidden");
              if (githubBtn) {
                githubBtn.innerHTML = 'Entrar com GitHub';
                githubBtn.disabled = false;
              }
              return;
            }

            handleLoginSuccess(res.data);
            window.location.href = "./profile-selection.html";
          })
          .catch(err => {
            console.error('GitHub Callback Error', err);
            const error = document.getElementById("error");
            error.textContent = 'Erro inesperado ao autenticar com GitHub.';
            error.classList.remove("hidden");
            if (githubBtn) {
              githubBtn.innerHTML = 'Entrar com GitHub';
              githubBtn.disabled = false;
            }
          });
      }
    </script>
  </body>
</html>
