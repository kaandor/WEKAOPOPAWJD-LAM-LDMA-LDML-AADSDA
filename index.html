<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <title>KLYX — Entrar</title>
    <style>
      body {
        background-color: #0b0e14;
        color: #fff;
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .brand-logo {
        max-width: 320px;
        width: 100%;
        height: auto;
        display: block;
        margin: 0 auto 20px;
      }
      .auth-card {
        width: 100%;
        max-width: 400px;
        padding: 20px;
      }
      .input {
        background: #1f2937;
        border: 1px solid rgba(255,255,255,0.1);
        color: white;
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .btn-primary {
        background: #A855F7;
        color: white;
        border: none;
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
      }
    </style>
    <link rel="stylesheet" href="./css/global.css?v=20260204-fix3" />
    <link rel="stylesheet" href="./css/login.css?v=20260204-fix3" />
  </head>
  <body>
    <div class="auth-shell">
      <div id="loginCard" class="auth-card">
        <div class="auth-top" style="justify-content: center;">
          <div class="brand" style="text-align: center;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" class="brand-logo" style="margin: 0 auto; display: block; width: 100%; max-width: 320px; height: auto;">
              <path d="M20 15 L 20 65 L 60 40 Z" fill="none" stroke="#A855F7" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
              <text x="75" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="42" fill="currentColor">Klyx</text>
              <rect x="155" y="15" width="6" height="6" rx="1" fill="#A855F7" />
              <rect x="163" y="8" width="6" height="6" rx="1" fill="#A855F7" />
              <rect x="148" y="22" width="4" height="4" rx="1" fill="#A855F7" opacity="0.8" />
            </svg>
          </div>
        </div>

        <div class="auth-title" style="text-align: center;">
          <h1>Entrar</h1>
          <p>Acesso seguro a Filmes e Séries.</p>
        </div>

        <div class="auth-actions" style="margin-top: 20px;">
            <button type="button" class="btn btn-github" id="githubLoginBtn">
                <svg height="24" viewBox="0 0 16 16" version="1.1" width="24" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                Entrar com GitHub
            </button>
            <button type="button" class="btn btn-google" id="googleLoginBtn" style="margin-top:10px">
                <svg width="24" height="24" viewBox="0 0 48 48">
                  <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.9 0-12.5-5.6-12.5-12.5S17.1 11 24 11c3.2 0 6.2 1.2 8.5 3.2l5.7-5.7C34.6 5.6 29.6 3.5 24 3.5 12.3 3.5 2.5 13.3 2.5 25S12.3 46.5 24 46.5c11.7 0 21.5-9.8 21.5-21.5 0-1.7-.2-3.5-.6-4.9z"/>
                  <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16.1 19 13 24 13c3.2 0 6.2 1.2 8.5 3.2l5.7-5.7C34.6 5.6 29.6 3.5 24 3.5 15.6 3.5 8.4 8.2 6.3 14.7z"/>
                  <path fill="#4CAF50" d="M24 46.5c5.3 0 10.1-2 13.7-5.4l-6.3-5.2c-2.1 1.4-4.8 2.2-7.5 2.2-5.3 0-9.8-3.4-11.4-8.2l-6.6 5.1C8.4 41.8 15.6 46.5 24 46.5z"/>
                  <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.4 5.6-6.3 7.2l6.3 5.2C39.9 37.9 42.5 32.1 42.5 25c0-1.7-.2-3.5-.6-4.9z"/>
                </svg>
                Entrar com Google
            </button>
        </div>

        <div id="error" class="error hidden"></div>
        <div id="connectionStatusDot" style="display:none;"></div>
      </div>
    </div>

    <script type="module">
      // Force fresh scripts on login page to avoid cached SW/old assets blocking OAuth
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(r => r.unregister());
          });
        }
      } catch(_) {}
      
      import { api } from "./js/api.js?v=20260222-loginfix";
      import { redirectIfAuthed, applyTheme } from "./js/auth.js?v=20260222-loginfix";
      import { handleLoginSuccess } from "./js/ui.js?v=20260222-loginfix";

      // Dev helper: ?logout=true clears session to allow seeing the login screen
      if (new URLSearchParams(window.location.search).has('logout')) {
          localStorage.removeItem('klyx.session');
          window.history.replaceState({}, document.title, window.location.pathname);
      }

      applyTheme();

      // GitHub / Google Buttons
      const githubBtn = document.getElementById('githubLoginBtn');
      const googleBtn = document.getElementById('googleLoginBtn');
      if (githubBtn) {
          githubBtn.addEventListener('click', async () => {
              const originalText = githubBtn.innerHTML;
              githubBtn.innerHTML = 'Conectando...';
              githubBtn.disabled = true;
              
              const res = await api.auth.loginWithGithub();
              
              if (res && res.ok && res.data && res.data.user) {
                  handleLoginSuccess(res.data.user);
                  return;
              }
              if (res && !res.ok) {
                  const error = document.getElementById("error");
                  error.textContent = res.data.error;
                  error.classList.remove("hidden");
                  githubBtn.innerHTML = originalText;
                  githubBtn.disabled = false;
              }
          });
      }
      // Google Login Handler (Device Flow)
      if (googleBtn) {
          googleBtn.addEventListener('click', async () => {
              const originalText = googleBtn.innerHTML;
              googleBtn.innerHTML = 'Conectando...';
              googleBtn.disabled = true;
              const r = await api.auth.startGoogleDeviceFlow();
              if (!r.ok) {
                  const error = document.getElementById("error");
                  error.textContent = r.data.error;
                  error.classList.remove("hidden");
                  googleBtn.innerHTML = originalText;
                  googleBtn.disabled = false;
                  return;
              }
              const { user_code, verification_uri, verification_uri_complete, interval } = r.data;
              const error = document.getElementById("error");
              error.classList.remove("hidden");
              error.style.color = "#ccc";
              error.innerHTML = `Abra <a href="${verification_uri}" target="_blank">${verification_uri}</a> e digite o código: <b>${user_code}</b>`;
              
              const confirmBtn = document.createElement('button');
              confirmBtn.className = "btn btn-google";
              confirmBtn.style.marginTop = "8px";
              confirmBtn.innerText = "Confirmar";
              confirmBtn.onclick = async () => {
                  confirmBtn.disabled = true;
                  confirmBtn.innerText = "Confirmando...";
                  const pr = await api.auth.pollGoogleDeviceToken();
                  if (pr.ok) {
                      handleLoginSuccess(pr.data.user);
                  } else {
                      confirmBtn.disabled = false;
                      confirmBtn.innerText = "Confirmar";
                      const e2 = document.createElement('div');
                      e2.style.color = "#ff8373";
                      e2.style.marginTop = "6px";
                      e2.innerText = pr.data.error || "Ainda pendente. Aguarde alguns segundos e clique Confirmar novamente.";
                      error.appendChild(e2);
                  }
              };
              error.appendChild(confirmBtn);
          });
      }

      // Check for GitHub Callback (OAuth Code Flow) BEFORE any auto-redirects
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      
      if (code && state) {
          if (githubBtn) {
              githubBtn.innerHTML = 'Autenticando...';
              githubBtn.disabled = true;
          }
          
          // Note: We don't clear the URL immediately anymore.
          // We wait until success so if the proxy fails, the user can refresh to retry 
          // without hitting GitHub's rate limit (generating new codes).
          
          api.auth.handleGithubCallback(code, state).then(res => {
               if (res.ok) {
                  // Clear URL only on success
                  window.history.replaceState({}, document.title, window.location.pathname);
                  handleLoginSuccess(res.data.user);
              } else {
                  const error = document.getElementById("error");
                  error.textContent = res.data.error;
                  error.classList.remove("hidden");
                  
                  // Show a "Retry" hint
                  const retryHint = document.createElement('div');
                  retryHint.style.fontSize = "12px";
                  retryHint.style.marginTop = "5px";
                  retryHint.style.color = "#ccc";
                  retryHint.innerText = "Dica: Atualize a página para tentar novamente sem sair.";
                  error.appendChild(retryHint);

                  if (githubBtn) {
                      githubBtn.innerHTML = `
                        <svg height="24" viewBox="0 0 16 16" version="1.1" width="24" aria-hidden="true">
                            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                        </svg>
                        Tentar Novamente`;
                      githubBtn.disabled = false;
                  }
              }
          });
      }
      
      // Only redirect if already authenticated AND no OAuth code present
      if (!code && !state) {
        redirectIfAuthed();
      }
      
      // Optional Fallback: Device Flow UI
      const errorDiv = document.getElementById("error");
      function showDeviceFlowPrompt() {
        const wrap = document.createElement('div');
        wrap.style.marginTop = "10px";
        const btn = document.createElement('button');
        btn.className = "btn btn-github";
        btn.innerText = "Login com código (Device Flow)";
        btn.onclick = async () => {
            btn.disabled = true;
            btn.innerText = "Gerando código...";
            const r = await api.auth.startGithubDeviceFlow();
            if (!r.ok) {
                btn.disabled = false;
                btn.innerText = "Login com código (Device Flow)";
                const m = document.createElement('div');
                m.style.color = "#ff8373";
                m.style.marginTop = "6px";
                m.innerText = r.data.error || "Falha ao iniciar Device Flow";
                wrap.appendChild(m);
                return;
            }
            const { user_code, verification_uri, verification_uri_complete, interval } = r.data;
            const info = document.createElement('div');
            info.style.marginTop = "8px";
            info.style.color = "#ccc";
            info.innerHTML = `Abra <a href="${verification_uri}" target="_blank">${verification_uri}</a> e digite o código: <b>${user_code}</b>`;
            wrap.appendChild(info);
            // Poll token
            const pollBtn = document.createElement('button');
            pollBtn.className = "btn btn-github";
            pollBtn.style.marginTop = "8px";
            pollBtn.innerText = "Confirmar";
            pollBtn.onclick = async () => {
                pollBtn.disabled = true;
                pollBtn.innerText = "Confirmando...";
                const pr = await api.auth.pollGithubDeviceToken();
                if (pr.ok) {
                    handleLoginSuccess(pr.data.user);
                } else {
                    pollBtn.disabled = false;
                    pollBtn.innerText = "Confirmar";
                    const e2 = document.createElement('div');
                    e2.style.color = "#ff8373";
                    e2.style.marginTop = "6px";
                    e2.innerText = pr.data.error || "Ainda pendente. Aguarde alguns segundos e clique Confirmar novamente.";
                    wrap.appendChild(e2);
                }
            };
            wrap.appendChild(pollBtn);
        };
        wrap.appendChild(btn);
        errorDiv.appendChild(wrap);
      }
      // Show fallback when present error block becomes visible later
      const observer = new MutationObserver((mut) => {
        const isVisible = !errorDiv.classList.contains('hidden');
        if (isVisible && !errorDiv.dataset.deviceFlowShown) {
            errorDiv.dataset.deviceFlowShown = "1";
            showDeviceFlowPrompt();
        }
      });
      observer.observe(errorDiv, { attributes: true, attributeFilter: ['class'] });

      // Helper to get or generate MAC
      function getOrGenerateMac() {
         let mac = localStorage.getItem('klyx_device_mac');
         if (!mac) {
             const hex = () => Math.floor(Math.random() * 256).toString(16).padStart(2, '0');
             mac = `${hex()}:${hex()}:${hex()}:${hex()}:${hex()}:${hex()}`;
             localStorage.setItem('klyx_device_mac', mac);
         }
         return mac;
      }
      
      // Initialize MAC immediately
      getOrGenerateMac();

      // Connection Status Check
      const connectionDot = document.getElementById("connectionStatusDot");
      if (connectionDot) {
          api.status.checkConnection().then(isConnected => {
              if (isConnected) {
                  connectionDot.classList.add("connected");
              } else {
                  connectionDot.classList.remove("connected");
              }
          });
      }
      
      const error = document.getElementById("error");
    </script>
  </body>
</html>
